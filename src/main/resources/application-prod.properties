# 운영 환경 설정

# 실제 운영 환경에서는 MySQL, PostgreSQL 등을 사용해야 합니다
# 예시: MySQL 설정
# spring.datasource.url=jdbc:mysql://localhost:3306/corp_member_library?useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=your_username
# spring.datasource.password=your_password

# 현재는 H2 사용 (테스트용)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔 비활성화 (운영 환경에서는 보안상 비활성화)
spring.h2.console.enabled=false

# JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 로깅 설정 (운영 환경에서는 INFO 레벨 이상만 출력)
logging.level.org.hibernate.SQL=INFO
logging.level.com.david.CorpMemberLibrary=INFO
