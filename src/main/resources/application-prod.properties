# 운영 환경 설정

# MySQL 데이터베이스 설정
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=dkagh1@

# JPA/Hibernate 설정
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 로깅 설정 (운영 환경에서는 INFO 레벨 이상만 출력)
logging.level.org.hibernate.SQL=INFO
logging.level.com.david.CorpMemberLibrary=INFO
